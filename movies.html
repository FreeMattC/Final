<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tier List</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>My Movie Tier List</h1>
        <p>Ranking my favorite movies</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="tv-shows.html">TV Shows</a>
        <a href="video-games.html">Video Games</a>
    </nav>

    <main>
        <section class="tier-intro">
            <h2>My Movie Rankings</h2>
            <p>Ranking my favorite movies from the best to the worst.</p>
        </section>

        <section class="tier-list">
            <div class="tier-row">
                <div class="tier-label goat-tier">GOAT</div>
                <div class="tier-items">
                    <div class="tier-card">
                        <img src="images/Movies/megamind_ver3.webp" alt="Movie 1 poster">
                    </div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label top-tier">Top Tier</div>
                <div class="tier-items">
                    <div class="tier-card">
                        <img src="images/Movies/Ponyo.jpg" alt="Movie 2 poster">
                    </div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label high-tier">High Tier</div>
                <div class="tier-items"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label mid-tier">Mid Tier</div>
                <div class="tier-items"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label low-tier">Low Tier</div>
                <div class="tier-items"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label crap-tier">Crap Tier</div>
                <div class="tier-items"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>My Tier Lists | 2026</p>
    </footer>

</body>
</html>
